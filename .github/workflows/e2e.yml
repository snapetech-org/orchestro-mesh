# ng-runner-policy: private-jit-only-v1
name: e2e (cross-repo)


run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      format('action:ci:pool:private:tag:{0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'ci', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'ci', inputs.runner_pool || 'private') || format('action:ci:pool:private') }}
on:

  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: Required workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true
      orchestro_ref:
        description: "Git ref of snapetech/orchestro to test against"
        required: false
        default: "main"

jobs:
  cross-repo:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (
        github.event_name == 'workflow_dispatch' &&
        github.ref == 'refs/heads/main' &&
        inputs.action == 'ci' &&
        inputs.runner_pool == 'private'
        ) ||
        (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'workflow_dispatch')
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-orchestro-mesh","ng-main-run-{0}","gha-{0}-cross-repo"]}}', github.run_id)) }}
    steps:
      - name: Check out orchestro-mesh
        uses: actions/checkout@v4
        with:
          path: orchestro-mesh

      - name: Check out orchestro
        uses: actions/checkout@v4
        with:
          repository: snapetech/orchestro
          ref: ${{ github.event.inputs.orchestro_ref || 'main' }}
          path: orchestro

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install both packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./orchestro-mesh[dev]
          python -m pip install -e ./orchestro

      - name: Verify cross-imports
        run: |
          python -c "import orchestro_mesh, orchestro; print('mesh', orchestro_mesh.__version__)"
          python -c "from orchestro.backends.mesh import MeshBackend; from orchestro import mesh_feedback; print('mesh backend + feedback ok')"

      - name: Run mesh unit suite
        working-directory: orchestro-mesh
        run: pytest tests --ignore=tests/e2e

      - name: Run cross-repo e2e suite
        working-directory: orchestro-mesh
        run: pytest tests/e2e -v
