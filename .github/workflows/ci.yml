# ng-runner-policy: private-jit-only-v1
name: CI


run-name: ${{ format('action:{0}:pool:{1}', inputs.action, inputs.runner_pool) }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Required private CI action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true
  pull_request:
    types: [labeled]

jobs:
  test:
    # Keep external fork code off trusted JIT groups until its isolated route is authorized.
    if: >-
      (
        (
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        (github.event.label.name == 'action:ci' || github.event.label.name == 'pool:private') &&
        contains(github.event.pull_request.labels.*.name, 'action:ci') &&
        contains(github.event.pull_request.labels.*.name, 'pool:private') &&
        github.event.pull_request.head.repo.full_name == github.repository
        ) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.action == 'ci' && inputs.runner_pool == 'private')
      ) &&
      (
        github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-orchestro-mesh","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -c "import tiktoken; print('tiktoken', tiktoken.__version__)"
      - run: pytest
      - run: ruff check src tests
