# ng-runner-policy: private-jit-only-v1
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-orchestro-mesh","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -c "import tiktoken; print('tiktoken', tiktoken.__version__)"
      - run: pytest
      - run: ruff check src tests
